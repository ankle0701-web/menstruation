<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생리일지 · 물봉선</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />

<!-- ============================================================
  Firebase (Firestore) 새 프로젝트 설정 안내
  1) https://console.firebase.google.com 새 프로젝트 생성 (애널리틱스는 꺼도 무방)
  2) Firestore Database → 데이터베이스 만들기 (서울 asia-northeast3 추천)
  3) 규칙(Rules) 탭:
     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         match /{document=**} { allow read, write: if true; }
       }
     }
  4) 프로젝트 설정 → 내 앱 → 웹앱 추가 → firebaseConfig 복사해서 아래에 붙여넣기
============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#F6F1F3;
  --surface:#FFFFFF;
  --surface-soft:#F1E6EC;
  --ink:#2E2530;
  --ink-soft:#78677F;
  --ink-faint:#AB9CB0;
  --line:#E5D9E2;

  --primary:#A8638F;
  --primary-dark:#7E4A6C;
  --primary-soft:#F3E3EC;

  --warn:#C77B3E;
  --danger:#B85656;

  --shadow:0 1px 3px rgba(46,37,48,0.08), 0 1px 2px rgba(46,37,48,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:60px;
}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 0;}

header.app-header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:18px;}
.title-block .eyebrow{font-size:12.5px;font-weight:600;color:var(--primary);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px;}
.title-block h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-0.02em;}
.title-block p{margin:4px 0 0;font-size:13.5px;color:var(--ink-soft);}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;}

button{font-family:inherit;cursor:pointer;border:none;}
.btn{padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;background:var(--surface);color:var(--ink);border:1px solid var(--line);transition:.15s;}
.btn:hover{background:var(--surface-soft);}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
.btn-ghost:hover{background:var(--surface-soft);}
.btn-sm{padding:6px 10px;font-size:12.5px;border-radius:6px;}
.btn-danger-text{color:var(--danger);background:transparent;border:none;font-size:11.5px;font-weight:600;}
.btn-danger-text:hover{text-decoration:underline;}

.setup-warning{background:#FBEADA;border:1px solid #EFCFA0;border-radius:10px;padding:14px 16px;font-size:13px;color:#7A4A17;margin-bottom:18px;line-height:1.6;}
.setup-warning code{background:#fff;padding:1px 5px;border-radius:4px;}

select, input[type=text], textarea{
  font-family:inherit;font-size:13.5px;padding:8px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
}
select:focus, input:focus, textarea:focus{outline:2px solid var(--primary-soft);border-color:var(--primary);}

.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:14px;}
.month-nav{display:flex;align-items:center;gap:6px;}
.month-nav .month-label{font-size:17px;font-weight:700;min-width:100px;text-align:center;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-soft);}
.icon-btn:hover{background:var(--surface-soft);}

.add-row{display:flex;gap:8px;align-items:center;}
.add-row input{width:160px;}

.grid-card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px;overflow-x:auto;}
.grid-card h2{margin:0 0 12px;font-size:15px;font-weight:700;}
table.check-table{border-collapse:collapse;font-size:12px;min-width:100%;}
table.check-table th, table.check-table td{border:1px solid var(--line);text-align:center;padding:0;}
table.check-table th{background:var(--surface-soft);color:var(--ink-soft);font-weight:600;font-size:11px;padding:6px 2px;}
table.check-table th.name-col, table.check-table td.name-col{
  text-align:left;padding:6px 10px;font-weight:700;white-space:nowrap;position:sticky;left:0;background:var(--surface);min-width:110px;
}
table.check-table th.day-col{width:26px;}
table.check-table td.day-cell{width:26px;height:30px;cursor:pointer;}
table.check-table td.day-cell.weekend{background:#FBF3F6;}
table.check-table td.day-cell.today-col{background:var(--primary-soft);}
table.check-table td.day-cell .mark{
  display:inline-block;width:16px;height:16px;border-radius:4px;
}
table.check-table td.day-cell.checked .mark{background:var(--primary);}
table.check-table td.day-cell.pending .mark{background:transparent;border:2px dashed var(--primary);}
table.check-table td.day-cell:hover .mark{outline:2px solid var(--primary-soft);}
.pending-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--primary-soft);color:var(--primary-dark);
  border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12.5px;font-weight:600;
}
table.check-table td.total-col{font-weight:700;color:var(--primary-dark);background:var(--surface-soft);min-width:44px;}
table.check-table td.del-col{min-width:40px;}
.empty-note{color:var(--ink-faint);font-size:13px;padding:10px 0;}

.note-card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:18px;margin-bottom:18px;}
.note-card h2{margin:0 0 4px;font-size:15px;font-weight:700;}
.note-card .hint{font-size:12px;color:var(--ink-faint);margin-bottom:10px;}
.note-card textarea{width:100%;min-height:90px;resize:vertical;}
.save-hint{font-size:11.5px;color:var(--ink-faint);margin-top:6px;}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:100;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

#printArea{display:none;}
.print-title{font-size:16px;font-weight:700;margin:0 0 12px;}
.print-table{width:100%;border-collapse:collapse;table-layout:fixed;}
.print-table th,.print-table td{border:1px solid #999;padding:3px 2px;text-align:center;font-size:9.5px;}
.print-table th{background:#f2eef1;font-weight:700;}
.print-table td.name-col{text-align:left;padding-left:5px;font-weight:700;width:70px;}
.print-note{margin-top:14px;font-size:11px;white-space:pre-wrap;border:1px solid #999;padding:8px;min-height:50px;}
.print-note-label{font-size:10.5px;font-weight:700;margin-bottom:4px;}
.print-footer{font-size:10.5px;color:#777;text-align:right;margin-top:8px;}

@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{display:block;position:absolute;top:0;left:0;width:100%;padding:16px;}
  body{background:#fff;padding:0;}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="app-header">
    <div class="title-block">
      <div class="eyebrow">사하의집 · 물봉선</div>
      <h1>생리일지</h1>
      <p>이름과 날짜가 만나는 칸을 눌러 시작일로 지정하고, 끝나는 날짜를 한 번 더 누르면 그 사이 날짜가 전부 체크돼요.</p>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="printMonth()">🖨️ 이번달 인쇄</button>
    </div>
  </header>

  <div id="setupWarning" class="setup-warning" style="display:none;">
    ⚠️ Firebase 연결이 설정되지 않았습니다. 이 파일 상단의 <code>firebaseConfig</code> 부분을 본인의 Firebase 프로젝트 값으로 채워주세요. 그 전까지는 데이터가 저장되지 않고 새로고침하면 사라집니다.
  </div>

  <div class="toolbar">
    <div class="add-row">
      <input type="text" id="newName" placeholder="이용인 이름 추가" onkeydown="if(event.key==='Enter')addResident()">
      <button class="btn btn-primary btn-sm" onclick="addResident()">＋ 추가</button>
    </div>
    <div class="month-nav">
      <button class="icon-btn" onclick="changeMonth(-1)">◀</button>
      <div class="month-label" id="monthLabel">2026년 7월</div>
      <button class="icon-btn" onclick="changeMonth(1)">▶</button>
      <button class="btn btn-ghost btn-sm" onclick="goToday()">오늘</button>
    </div>
  </div>

  <div class="grid-card">
    <h2>이번달 체크표</h2>
    <div id="gridArea"></div>
  </div>

  <div class="note-card">
    <h2>📝 특이사항</h2>
    <div class="hint">이번달 전체에 대한 메모입니다 (증상, 주의 대상자 등).</div>
    <textarea id="monthNote" placeholder="예: OOO 생리통 심함, 진통제 상시 준비 필요" oninput="saveNoteDebounced()"></textarea>
    <div class="save-hint" id="noteSaveHint"></div>
  </div>

</div>

<div id="printArea"></div>
<div id="toast"></div>

<script>
/* ===================== Firebase 설정 =====================
   ↓↓↓ 여기를 본인의 Firebase 프로젝트 설정값으로 교체하세요 ↓↓↓
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyBlWqTxwi4hKLwc_8cBZzoq1P9SJrNqjgk",
  authDomain: "menstruation-1219d.firebaseapp.com",
  projectId: "menstruation-1219d",
  storageBucket: "menstruation-1219d.firebasestorage.app",
  messagingSenderId: "253807530499",
  appId: "1:253807530499:web:145b0dd59e78e1d4dfb436"
};

let db = null;
let firebaseReady = false;

try{
  if(firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY"){
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
  }else{
    document.getElementById('setupWarning').style.display = 'block';
  }
}catch(e){
  console.error(e);
  document.getElementById('setupWarning').style.display = 'block';
}

/* ===================== 상태 ===================== */
let viewYear = new Date().getFullYear();
let viewMonth = new Date().getMonth(); // 0-indexed
let roster = [];        // [{id, name}]
let checkDocs = {};     // key: name -> {id, residentName, yearMonth, days:[1,5,12]}
let noteDoc = { note: '' };
let noteTimer = null;
let pendingStart = { name: null, day: null }; // 범위 선택용 시작일 대기 상태

function yearMonthKey(){ return `${viewYear}-${String(viewMonth+1).padStart(2,'0')}`; }
function todayISO(){
  const t = new Date();
  return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
}

/* ===================== Firestore 연동 ===================== */
function loadRoster(){
  if(!firebaseReady){ renderAll(); return; }
  db.collection('period_roster').onSnapshot(snap => {
    roster = snap.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b) => a.name.localeCompare(b.name,'ko'));
    renderAll();
  }, err => { console.error(err); showToast('명단을 불러오지 못했습니다.'); });
}
function loadChecksForMonth(){
  checkDocs = {};
  if(!firebaseReady){ renderGrid(); return; }
  const ym = yearMonthKey();
  db.collection('period_checks').where('yearMonth','==',ym).onSnapshot(snap => {
    checkDocs = {};
    snap.docs.forEach(doc => {
      const d = doc.data();
      checkDocs[d.residentName] = { id: doc.id, ...d };
    });
    renderGrid();
  }, err => { console.error(err); showToast('체크 데이터를 불러오지 못했습니다.'); });
}
function loadNoteForMonth(){
  noteDoc = { note: '' };
  if(!firebaseReady){ document.getElementById('monthNote').value = ''; return; }
  const ym = yearMonthKey();
  db.collection('period_notes').doc(ym).get().then(docSnap => {
    noteDoc = docSnap.exists ? docSnap.data() : { note: '' };
    document.getElementById('monthNote').value = noteDoc.note || '';
  }).catch(err => console.error(err));
}

function addResident(){
  const name = document.getElementById('newName').value.trim();
  if(!name){ showToast('이름을 입력해주세요.'); return; }
  if(roster.some(r => r.name === name)){ showToast('이미 등록된 이름입니다.'); return; }

  if(!firebaseReady){
    roster.push({ id: 'local-'+Date.now(), name });
    roster.sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    renderAll();
    document.getElementById('newName').value = '';
    showToast('추가되었습니다 (Firebase 미연결 · 새로고침 시 사라짐)');
    return;
  }
  db.collection('period_roster').add({ name }).then(() => {
    document.getElementById('newName').value = '';
    showToast('추가되었습니다.');
  }).catch(err => { console.error(err); showToast('추가에 실패했습니다.'); });
}
function removeResident(id, name){
  if(!confirm(`${name}님을 명단에서 삭제할까요? (이전 기록은 남아있어요)`)) return;
  if(!firebaseReady){
    roster = roster.filter(r => r.id !== id);
    renderAll();
    return;
  }
  db.collection('period_roster').doc(id).delete().then(() => showToast('삭제되었습니다.'))
    .catch(err => { console.error(err); showToast('삭제에 실패했습니다.'); });
}

function saveDays(name, days){
  const ym = yearMonthKey();
  const existing = checkDocs[name];
  const id = existing ? existing.id : `${name}__${ym}`;
  days = [...new Set(days)].sort((a,b) => a-b);
  checkDocs[name] = { id, residentName: name, yearMonth: ym, days };
  renderGrid();

  if(!firebaseReady){
    showToast('체크되었습니다 (Firebase 미연결 · 새로고침 시 사라짐)');
    return;
  }
  db.collection('period_checks').doc(id).set({ residentName: name, yearMonth: ym, days })
    .catch(err => { console.error(err); showToast('저장에 실패했습니다.'); });
}

/* 칸 클릭: 처음 누르면 "시작일" 대기, 같은 줄에서 다시 누르면 그 사이 날짜가 전부 체크됨.
   이미 체크된 칸을 대기 상태 없이 누르면 그 날짜만 체크 해제됩니다. */
function onCellClick(name, day){
  const days = (checkDocs[name] && checkDocs[name].days) || [];

  if(pendingStart.name === name){
    // 두번째 클릭: 시작일 ~ 이 날짜까지 모두 체크
    const start = Math.min(pendingStart.day, day);
    const end = Math.max(pendingStart.day, day);
    const newDays = days.slice();
    for(let d=start; d<=end; d++){ if(!newDays.includes(d)) newDays.push(d); }
    pendingStart = { name: null, day: null };
    saveDays(name, newDays);
    return;
  }

  if(pendingStart.name && pendingStart.name !== name){
    // 다른 이용인 줄을 눌렀다면 이전 대기는 취소하고 새로 시작
    pendingStart = { name: null, day: null };
  }

  if(days.includes(day)){
    // 대기 중이 아닐 때 이미 체크된 칸을 누르면 그 날짜만 해제
    saveDays(name, days.filter(d => d !== day));
    return;
  }

  // 첫 클릭: 시작일로 대기
  pendingStart = { name, day };
  renderGrid();
}
function cancelPending(){
  pendingStart = { name: null, day: null };
  renderGrid();
}

function saveNoteDebounced(){
  clearTimeout(noteTimer);
  document.getElementById('noteSaveHint').textContent = '입력 중...';
  noteTimer = setTimeout(() => {
    const val = document.getElementById('monthNote').value;
    const ym = yearMonthKey();
    if(!firebaseReady){
      document.getElementById('noteSaveHint').textContent = '저장되었습니다 (Firebase 미연결 · 새로고침 시 사라짐)';
      return;
    }
    db.collection('period_notes').doc(ym).set({ note: val }).then(() => {
      document.getElementById('noteSaveHint').textContent = '저장되었습니다.';
      setTimeout(() => { document.getElementById('noteSaveHint').textContent=''; }, 1500);
    }).catch(err => { console.error(err); document.getElementById('noteSaveHint').textContent = '저장 실패'; });
  }, 600);
}

/* ===================== 렌더링 ===================== */
function changeMonth(delta){
  viewMonth += delta;
  if(viewMonth < 0){ viewMonth = 11; viewYear--; }
  if(viewMonth > 11){ viewMonth = 0; viewYear++; }
  renderAll();
}
function goToday(){
  const t = new Date();
  viewYear = t.getFullYear();
  viewMonth = t.getMonth();
  renderAll();
}

function renderAll(){
  document.getElementById('monthLabel').textContent = `${viewYear}년 ${viewMonth+1}월`;
  loadChecksForMonth();
  loadNoteForMonth();
  renderGrid();
}

function renderGrid(){
  const area = document.getElementById('gridArea');
  if(roster.length === 0){
    area.innerHTML = '<div class="empty-note">이용인을 추가하면 표가 나타나요. (위쪽 "이용인 이름 추가"에 입력)</div>';
    return;
  }
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  const todayStr = todayISO();
  const todayDay = todayStr.startsWith(yearMonthKey()) ? new Date().getDate() : null;

  let statusHtml = '';
  if(pendingStart.name){
    statusHtml = `<div class="pending-bar">📌 <b>${escapeHtml(pendingStart.name)}</b>님 ${pendingStart.day}일 선택됨 — 끝나는 날짜를 눌러주세요 (같은 날짜를 다시 누르면 그 날만 체크돼요)
      <button class="btn btn-ghost btn-sm" onclick="cancelPending()">선택 취소</button></div>`;
  }

  let dayHeaders = '';
  for(let d=1; d<=daysInMonth; d++){
    dayHeaders += `<th class="day-col">${d}</th>`;
  }

  let bodyRows = '';
  roster.forEach(r => {
    const checked = (checkDocs[r.name] && checkDocs[r.name].days) || [];
    let cells = '';
    for(let d=1; d<=daysInMonth; d++){
      const dow = new Date(viewYear, viewMonth, d).getDay();
      const isWeekend = dow===0 || dow===6;
      const isToday = d === todayDay;
      const isChecked = checked.includes(d);
      const isPending = pendingStart.name === r.name && pendingStart.day === d;
      cells += `<td class="day-cell ${isWeekend?'weekend':''} ${isToday?'today-col':''} ${isChecked?'checked':''} ${isPending?'pending':''}" onclick="onCellClick('${escapeAttr(r.name)}', ${d})"><span class="mark"></span></td>`;
    }
    bodyRows += `<tr>
      <td class="name-col">${escapeHtml(r.name)}</td>
      ${cells}
      <td class="total-col">${checked.length}일</td>
      <td class="del-col"><button class="btn-danger-text" onclick="removeResident('${r.id}','${escapeAttr(r.name)}')">삭제</button></td>
    </tr>`;
  });

  area.innerHTML = `${statusHtml}<table class="check-table">
    <thead><tr><th class="name-col">이름</th>${dayHeaders}<th>합계</th><th></th></tr></thead>
    <tbody>${bodyRows}</tbody>
  </table>`;
}

function escapeHtml(str){
  if(str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){
  if(str == null) return '';
  return String(str).replace(/'/g, "\\'");
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ===================== 인쇄 (한달치) ===================== */
function printMonth(){
  const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
  let dayHeaders = '';
  for(let d=1; d<=daysInMonth; d++) dayHeaders += `<th>${d}</th>`;

  let bodyRows = '';
  if(roster.length === 0){
    bodyRows = `<tr><td colspan="${daysInMonth+1}" style="padding:14px;">등록된 이용인이 없습니다.</td></tr>`;
  }else{
    roster.forEach(r => {
      const checked = (checkDocs[r.name] && checkDocs[r.name].days) || [];
      let cells = '';
      for(let d=1; d<=daysInMonth; d++){
        cells += `<td>${checked.includes(d) ? '●' : ''}</td>`;
      }
      bodyRows += `<tr><td class="name-col">${escapeHtml(r.name)}</td>${cells}</tr>`;
    });
  }

  const noteVal = document.getElementById('monthNote').value || '';

  document.getElementById('printArea').innerHTML = `
    <div class="print-title">생리일지 · 사하의집 물봉선 · ${viewYear}년 ${viewMonth+1}월</div>
    <table class="print-table">
      <thead><tr><th class="name-col">이름</th>${dayHeaders}</tr></thead>
      <tbody>${bodyRows}</tbody>
    </table>
    <div class="print-note-label">특이사항</div>
    <div class="print-note">${escapeHtml(noteVal)}</div>
    <div class="print-footer">출력일: ${todayISO()}</div>
  `;
  window.print();
}

loadRoster();

window.addEventListener('load', () => {
  requestAnimationFrame(() => renderAll());
});
</script>
</body>
</html>
